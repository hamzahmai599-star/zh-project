name: Build Flet App
on:
  push:
    branches: [ main ]
  workflow_dispatch:
env:
  UV_PYTHON: 3.12
  PYTHONUTF8: 1
  BUILD_NUMBER: 1
  BUILD_VERSION: 1.0.0
  FLET_CLI_NO_RICH_OUTPUT: 1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Build APK
        run: uv run flet build apk --yes --verbose --build-number=$BUILD_NUMBER --build-version=$BUILD_VERSION
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/apk
